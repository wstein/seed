name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  ELIXIR_VERSION: "1.19"
  OTP_VERSION: "28"

jobs:
  verify:
    name: Quality gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Cache deps and build
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-

      - name: Cache Dialyzer PLT
        uses: actions/cache@v4
        with:
          path: _build/*/dialyxir_*.plt*
          key: ${{ runner.os }}-plt-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-plt-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-

      - run: mix deps.get

      - name: Verify (format, lint, test, build, dialyzer)
        run: make verify

  atn-fixtures-drift:
    name: ATN fixture drift gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Regenerate serialized-ATN fixtures
        run: scripts/gen_atn_fixtures.sh

      - name: Fail on fixture drift
        run: |
          if ! git diff --quiet -- test/fixtures/atn; then
            echo "::error::Serialized-ATN fixtures are out of date. Run scripts/gen_atn_fixtures.sh and commit the result."
            git diff --stat -- test/fixtures/atn
            exit 1
          fi
          echo "Fixtures match the canonical ANTLR4 output."
